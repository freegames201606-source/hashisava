<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>はしちゃんサバイバー</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <div id="top-bar" class="hidden">
    <button id="pauseBtn" class="top-btn">Ⅱ</button>
    <button id="soundBtn" class="top-btn">♪</button>
  </div>

  <div id="test-badge" class="hidden">TEST MODE</div>

  <div id="speed-bar" class="hidden">
    <button class="speed-btn" data-speed="1">1x</button>
    <button class="speed-btn" data-speed="2">2x</button>
    <button class="speed-btn" data-speed="5">5x</button>
    <button class="speed-btn" data-speed="10">10x</button>
  </div>

  <div id="pause" class="hidden">
    <h2>PAUSE</h2>
    <button id="resumeBtn">再開</button>
    <button id="quitBtn">タイトルへ</button>
  </div>

  <div id="levelup" class="hidden">
    <h2>LEVEL UP!</h2>
    <p>強化を選んでください</p>
    <div id="choices"></div>
  </div>

  <div id="overlay">
    <h1 id="overlay-title">はしちゃん<br>サバイバー</h1>
    <p id="overlay-subtitle">ひらた来襲！</p>
    <p id="overlay-msg">タップ / クリックで開始</p>

    <p id="overlay-test-badge" class="hidden">TEST MODE</p>

    <div id="diff-block">
      <p class="diff-label">難易度</p>
      <div id="difficulty">
        <button class="diff-btn selected" data-diff="easy">EASY</button>
        <button class="diff-btn" data-diff="normal">NORMAL</button>
        <button class="diff-btn" data-diff="hard">HARD</button>
      </div>
    </div>

    <div id="sound-block">
      <button id="overlaySoundBtn" class="sound-btn">♪ 音: ON</button>
    </div>

    <div id="overlay-help">
      <p>・PC：マウス位置へ移動</p>
      <p>・スマホ：画面をドラッグしてスティック操作</p>
      <p>・攻撃は自動</p>
      <p>・レベルアップで3択強化</p>
    </div>

    <div id="hiscore-line">
      <p class="hiscore-label">ハイスコア</p>
      <p class="hiscore-value"><span id="hiscore-value">0.0</span>秒</p>
    </div>

    <button id="startBtn">START</button>
  </div>

  <script src="./audio.js"></script>
  <script src="./main.js"></script>
</body>
</html>
